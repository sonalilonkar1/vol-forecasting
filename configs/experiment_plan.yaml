pred_dir: experiments/preds
archive_dir: experiments/preds/runs
results_dir: experiments/results

backtest:
  command:
    - python
    - -m
    - src.backtest.run
  args:
    --config: configs/backtest.yaml
    --returns-path: data/processed/returns.csv
    --out-dir: experiments/results

experiments:
  - name: seq_rnn
    command:
      - python
      - -m
      - src.models.simple_rnn
    horizons: [1, 5, 22]
    run_prefix_template: "{name}_{slug}"
    args:
      --eval-splits:
        - test
      --device: cpu
      --epochs: 75
      --batch-size: 256
      --min-train: 800
    grid:
      - name: cell_type
        flag: --cell-type
        values: ["gru", "lstm"]
      - name: lookback
        flag: --lookback
        values: [30, 60]
      - name: hidden_dim
        flag: --hidden-dim
        values: [64, 128]
      - name: dropout
        flag: --dropout
        values: [0.0, 0.1]
      - name: harx
        flag: --harx
        kind: flag
        values: [false, true]

  - name: mlp_grid
    command:
      - python
      - -m
      - src.models.simple_mlp
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --epochs: 60
      --batch-size: 512
    grid:
      - name: hidden_dim
        flag: --hidden-dim
        values: [128]
      - name: num_layers
        flag: --num-layers
        values: [2]
      - name: dropout
        flag: --dropout
        values: [0.1]
      - name: harx
        flag: --harx
        kind: flag
        values: [true]

  - name: har_baselines
    command:
      - python
      - -m
      - src.models.har_rv
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --splits-config: configs/splits.yaml
      --min-train: 300
    grid:
      - name: harx
        flag: --harx
        kind: flag
        values: [false, true]
      - name: estimator
        flag: --estimator
        values: ["ols", "ridge"]
      - name: ridge_alpha
        flag: --ridge-alpha
        values: [0.25, 0.75, 1.5]
        only_when:
          estimator: ridge

  - name: gbt_baselines
    command:
      - python
      - -m
      - src.models.gbt
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --splits-config: configs/splits.yaml
      --early-stopping: 30
      --seed: 42
      --subsample: 0.8
      --colsample-bytree: 0.8
      --lambda_: 1.0
    grid:
      - name: n_estimators
        flag: --n-estimators
        values: [600, 900]
      - name: learning_rate
        flag: --learning-rate
        values: [0.03]
      - name: max_depth
        flag: --max-depth
        values: [4]

  - name: garch_baselines
    command:
      - python
      - -m
      - src.models.garch
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --splits-config: configs/splits.yaml
      --file-prefix: garch
    grid:
      - name: min_train
        flag: --min-train
        values: [252]
      - name: refit_every
        flag: --refit-every
        values: [44]

  - name: nbeats_sweeps
    command:
      - python
      - -m
      - src.models.nbeats
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --file-prefix: nbeats
      --epochs: 50
      --batch-size: 256
      --device: cpu
    grid:
      - name: lookback
        flag: --lookback
        values: [60]
      - name: hidden_dim
        flag: --hidden-dim
        values: [128]
      - name: num_stacks
        flag: --num-stacks
        values: [2]

  - name: informer_runs
    command:
      - python
      - -m
      - src.models.informer
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - test
      --splits-config: configs/splits.yaml
      --batch-size: 64
      --max-epochs: 50
      --patience: 8
    grid:
      - name: seq_len
        flag: --seq-len
        values: [64]
      - name: d_ff
        flag: --d-ff
        values: [256]
      - name: n_heads
        flag: --n-heads
        values: [4]

  - name: tft_multihorizon
    command:
      - python
      - -m
      - src.models.tft
    horizons: [1, 5, 22]
    run_prefix_template: "{name}_{slug}"
    args:
      --eval-splits:
        - test
      --device: cpu
      --epochs: 40
      --batch-size: 128
      --grad-clip: 1.0
      --loss: qlike
    grid:
      - name: harx
        flag: --harx
        kind: flag
        values: [true]
      - name: lookback
        flag: --lookback
        values: [60]
      - name: hidden_dim
        flag: --hidden-dim
        values: [192]
      - name: dropout
        flag: --dropout
        values: [0.1]

  # Lightweight experiment set for quick sanity comparisons
  - name: seq_rnn_quick
    command:
      - python
      - -m
      - src.models.simple_rnn
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --device: cpu
      --epochs: 15
      --batch-size: 128
      --cell-type: gru
      --lookback: 30
      --hidden-dim: 64
      --dropout: 0.1
      --min-train: 400
    grid: []

  - name: nbeats_quick
    command:
      - python
      - -m
      - src.models.nbeats
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --file-prefix: nbeats_quick
      --epochs: 20
      --batch-size: 128
      --device: cpu
      --lookback: 60
      --hidden-dim: 64
      --num-stacks: 2
      --num-blocks: 2
    grid: []

  - name: har_quick
    command:
      - python
      - -m
      - src.models.har_rv
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --min-train: 200
      --harx: false
      --estimator: ols
    grid: []

  - name: gbt_quick
    command:
      - python
      - -m
      - src.models.gbt
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --early-stopping: 15
      --seed: 42
      --subsample: 0.8
      --colsample-bytree: 0.8
      --lambda_: 1.0
      --n-estimators: 300
      --learning-rate: 0.05
      --max-depth: 3
    grid: []

  - name: garch_quick
    command:
      - python
      - -m
      - src.models.garch
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --file-prefix: garch_quick
      --min-train: 252
      --refit-every: 44
    grid: []

  - name: mlp_quick
    command:
      - python
      - -m
      - src.models.simple_mlp
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --epochs: 20
      --batch-size: 256
      --hidden-dim: 128
      --num-layers: 2
      --dropout: 0.1
      --harx: false
      --min-train: 400
    grid: []

  - name: tft_quick
    command:
      - python
      - -m
      - src.models.tft
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --harx: false
      --lookback: 45
      --hidden-dim: 96
      --lstm-layers: 1
      --dropout: 0.1
      --num-heads: 2
      --epochs: 20
      --batch-size: 96
      --loss: qlike
      --grad-clip: 1.0
      --device: cpu
    grid: []

  - name: informer_quick
    command:
      - python
      - -m
      - src.models.informer
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --seq-len: 48
      --batch-size: 64
      --max-epochs: 20
      --patience: 5
      --lr: 1e-3
      --weight-decay: 1e-4
      --d-ff: 192
      --n-layers: 2
      --n-heads: 2
      --dropout: 0.1
    grid: []

  - name: gbt_panel_quick
    command:
      - python
      - -m
      - src.models.gbt_panel
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --n-estimators: 300
      --learning-rate: 0.05
      --max-depth: 3
      --subsample: 0.8
      --colsample-bytree: 0.8
      --lambda_: 1.0
      --early-stopping: 15
      --seed: 42
    grid: []

  - name: informer_panel_quick
    command:
      - python
      - -m
      - src.models.informer_panel
    horizons: [1, 5, 22]
    args:
      --eval-splits:
        - val
        - test
      --splits-config: configs/splits.yaml
      --seq-len: 48
      --batch-size: 64
      --max-epochs: 20
      --patience: 5
      --lr: 1e-3
      --weight-decay: 1e-4
      --d-ff: 192
      --n-layers: 2
      --n-heads: 2
